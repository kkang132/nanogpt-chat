<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoGPT Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-icon active" title="Chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <div class="sidebar-icon" title="Stats">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
        </div>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-icon" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </div>
    </div>

    <!-- Main content -->
    <div class="main">
        <!-- Title bar -->
        <div class="titlebar">
            <div class="titlebar-tab">
                <span class="tab-icon">&#9679;</span>
                chat.py
            </div>
            <div class="titlebar-breadcrumb">
                nanogpt <span>/</span> chat
            </div>
            <div class="titlebar-spacer"></div>
            <div class="titlebar-badge" id="statsBadge">
                <span id="chatCount">0</span> samples
            </div>
        </div>

        <!-- Chat messages -->
        <div class="chat-area" id="chatContainer">
            <div class="welcome">
                <div class="welcome-title">NanoGPT Chat</div>
                <div class="welcome-sub">
                    GPT-2 powered assistant. Conversations are saved for fine-tuning.<br>
                    Model running on <code id="deviceLabel">cpu</code>
                </div>
            </div>
        </div>

        <!-- Loading indicator -->
        <div class="loading-row" id="loading">
            <div class="avatar assistant-avatar">N</div>
            <div class="loading-bubble">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Input -->
        <div class="input-bar">
            <div class="input-wrapper">
                <span class="input-prefix">&gt;</span>
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Send a message..."
                    autocomplete="off"
                />
            </div>
            <button id="sendBtn">Send</button>
        </div>

        <!-- Status bar -->
        <div class="statusbar">
            <div class="status-item">
                <div class="status-dot"></div>
                ready
            </div>
            <div class="status-item">GPT-2</div>
            <div class="statusbar-spacer"></div>
            <div class="status-item" id="statusCount">0 conversations</div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
